name: Reproducibility
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - run: uv sync --group dev
      - run: make reproduce
